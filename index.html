<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لأجلكِ فقط</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo',sans-serif;
background:black;
color:white;
overflow:hidden;
}

/* ===== LOGIN ===== */
#login{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(10px);
z-index:999;
}

.login-box{
width:90%;
max-width:400px;
padding:40px;
border-radius:30px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 0 50px rgba(255,77,109,0.3);
text-align:center;
}

.login-box h2{
margin-bottom:20px;
color:#ffe5ec;
}

.login-box input{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:15px;
text-align:center;
outline:none;
margin-bottom:15px;
}

.login-box button{
width:100%;
padding:12px;
border:none;
border-radius:20px;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
color:white;
font-size:18px;
cursor:pointer;
}

/* ===== CARD ===== */
.card{
width:92%;
max-width:950px;
padding:60px;
border-radius:40px;
background:rgba(255,255,255,0.07);
backdrop-filter:blur(18px);
box-shadow:0 0 60px rgba(255,77,109,0.25);
text-align:center;
margin:80px auto;
animation:fade 2s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}

.title{
font-size:62px;
color:#ffe5ec;
margin-bottom:15px;
}

.sub{
font-size:22px;
opacity:0.8;
margin-bottom:35px;
}

.text{
font-size:27px;
line-height:2.4;
white-space:pre-line;
min-height:250px;
}

button{
margin-top:35px;
padding:18px 42px;
border:none;
border-radius:60px;
font-size:24px;
cursor:pointer;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
color:white;
}

.hidden{
display:none;
margin-top:35px;
font-size:32px;
color:#fff0f3;
}

.scroll{
overflow:auto;
height:100vh;
}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="login">
<div class="login-box">
<h2>اكتب كلمة السر</h2>
<input type="password" id="pass">
<button onclick="check()">دخول</button>
</div>
</div>

<div class="card" id="page">

<div class="title">لأجلكِ فقط</div>

<div class="sub">هاي الصفحة سويتها لأنج شخص مو عادي بحياتي</div>

<div class="text" id="typing"></div>

<button onclick="reveal()">احبج 💗</button>

<div id="final" class="hidden">
يمكن الدنيا كلها تتغير…  
بس حبي إلج يظل ثابت 🫀
</div>

</div>

<!-- ===== LOCAL AUDIO ===== -->
<audio id="audio" src="ILove.mp4"></audio>

<script>

/* ===== PASSWORD ===== */
function check(){
let p = document.getElementById("pass").value;

if(p === "👈🏻🪐👉🏻"){
document.getElementById("login").style.display="none";
document.getElementById("page").classList.add("scroll");

/* تشغيل الصوت المحلي */
let audio = document.getElementById("audio");
audio.play().catch(()=>{});

/* يبدأ النص */
startTyping();
}
}

/* ===== TEXT ===== */
const text = `
يمكن مو كل مرة عرفت أتصرف صح…  
ويمكن مرات جرحت قلبچ بدون ما أقصد.

بس أكو شيء واحد مستحيل يتغير:

إن وجودچ بحياتي مو شيء بسيط.

إنتِ مو مجرد شخص أحبه…  
إنتِ الشعور اللي يخليني أرجع مهما ابتعدت.

مو جاي أطلب تنسين بسرعة…  
ولا أريد أمسح زعلچ بكلمتين.

بس أريدچ تشوفين صدق إحساسي  
بعيد عن الأخطاء واللحظات السيئة.

لأن آخر شيء أريده بالدنيا  
هو أخسر إنسانة مثلچ.

حبي الابدي🌓
`;

let i=0;
function startTyping(){
function type(){
if(i < text.length){
document.getElementById("typing").innerHTML += text[i];
i++;
setTimeout(type,70);
}
}
type();
}

/* ===== FINAL ===== */
function reveal(){
document.getElementById("final").style.display="block";
}

</script>

</body>
</html>
