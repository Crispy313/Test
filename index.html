<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لأجلكِ فقط</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo',sans-serif;
background:black;
color:white;
overflow:hidden;
}

/* ===== BACKGROUND ===== */
.overlay{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle at center, rgba(255,77,109,0.18), rgba(0,0,0,0.9));
z-index:-2;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* ===== LOGIN ===== */
#login{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.9);
backdrop-filter:blur(10px);
z-index:999;
}

.login-box{
width:90%;
max-width:380px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 0 50px rgba(255,77,109,0.3);
text-align:center;
animation:fade 1s ease;
}

.login-box input{
width:100%;
padding:14px;
font-size:18px;
border:none;
border-radius:12px;
text-align:center;
margin-bottom:12px;
outline:none;
}

.login-box button{
width:100%;
padding:12px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
color:white;
font-size:18px;
cursor:pointer;
}

/* ===== CARD ===== */
.card{
width:92%;
max-width:900px;
margin:70px auto;
padding:50px;
border-radius:35px;
background:rgba(255,255,255,0.07);
backdrop-filter:blur(18px);
box-shadow:0 0 60px rgba(255,77,109,0.25);
text-align:center;
animation:fade 1.5s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

.title{
font-size:clamp(32px,6vw,60px);
color:#ffe5ec;
margin-bottom:10px;
}

.sub{
font-size:clamp(16px,3vw,22px);
opacity:0.8;
margin-bottom:25px;
}

.text{
font-size:clamp(18px,4vw,26px);
line-height:2.4;
white-space:pre-line;
min-height:200px;
}

button{
margin-top:25px;
padding:16px 38px;
border:none;
border-radius:50px;
font-size:clamp(18px,4vw,24px);
cursor:pointer;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
color:white;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

/* ===== FINAL ===== */
.hidden{
display:none;
margin-top:25px;
font-size:28px;
color:#fff0f3;
animation:fade 1s ease;
}

/* ===== HEART PULSE ===== */
.heart{
position:fixed;
bottom:20px;
right:20px;
font-size:30px;
animation:pulse 1.5s infinite;
opacity:0.7;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.3);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="overlay"></div>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<input type="password" id="pass" placeholder="">
<button onclick="check()">دخول</button>
</div>
</div>

<!-- MAIN -->
<div class="card" id="page">

<div class="title">لأجلكِ فقط</div>
<div class="sub">هاي الرسالة مو مجرد كلام… هاي شعور</div>

<div class="text" id="typing"></div>

<button onclick="love()">احبج 💗</button>

<div id="final" class="hidden">
يمكن الدنيا كلها تتغير…  
بس حبي إلج يظل ثابت 🫀
</div>

</div>

<div class="heart">🫀</div>

<!-- AUDIO -->
<audio id="audio" src="ILove.mp4"></audio>

<script>

/* ===== PASSWORD ===== */
function check(){
let p = document.getElementById("pass").value;

if(p === "👈🏻🪐👉🏻"){
document.getElementById("login").style.opacity="0";
setTimeout(()=>document.getElementById("login").style.display="none",500);

document.getElementById("audio").play().catch(()=>{});

startTyping();
}
}

/* ===== TEXT ===== */
const text = `
يمكن مو كل مرة عرفت أتصرف صح…  
ويمكن مرات جرحت قلبچ بدون ما أقصد.

بس أكو شيء واحد مستحيل يتغير:

إنتِ مو مجرد شخص…
إنتِ شعور ما ينمحى.

مو جاي أطلب تنسين…
بس أريدچ تفهمين إحساسي الحقيقي.

لأن آخر شيء أريده بالدنيا  
هو أخسر إنسانة مثلچ.

انتي حبي الابدي وتاج راسي ونظر عيني
اللله يديمج اليه ، ياقمر شمسج باقية تضوي وتحبج🌓
`;

let i=0;
function startTyping(){
let typingSound = new Audio("https://www.soundjay.com/button/sounds/button-16.mp3");

function type(){
if(i < text.length){
document.getElementById("typing").innerHTML += text[i];
typingSound.currentTime=0;
typingSound.play().catch(()=>{});
i++;
setTimeout(type,60);
}
}
type();
}

/* ===== LOVE EFFECT ===== */
function love(){
document.getElementById("final").style.display="block";

/* shake effect */
document.getElementById("page").style.transform="scale(1.02)";
setTimeout(()=>document.getElementById("page").style.transform="scale(1)",200);

/* hearts */
for(let i=0;i<10;i++){
let h=document.createElement("div");
h.innerHTML="💗";
h.style.position="fixed";
h.style.left=Math.random()*100+"vw";
h.style.top="80vh";
h.style.fontSize="20px";
h.style.animation="float 2s linear forwards";
document.body.appendChild(h);
setTimeout(()=>h.remove(),2000);
}
}

/* floating hearts animation */
const style=document.createElement("style");
style.innerHTML=`
@keyframes float{
from{transform:translateY(0);opacity:1;}
to{transform:translateY(-200px);opacity:0;}
}`;
document.head.appendChild(style);

</script>

</body>
</html>
