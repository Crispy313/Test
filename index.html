<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لأجلكِ فقط</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:'Cairo',sans-serif;
background:black;
color:white;
overflow:hidden;
}

/* ===== SCROLL ===== */

body.lock{
overflow:hidden;
}

body.scroll{
overflow-y:auto;
overflow-x:hidden;
}

/* ===== BACKGROUND ===== */

.overlay{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at center,
rgba(255,77,109,0.18),
rgba(0,0,0,0.92));
z-index:-2;
}

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
radial-gradient(white 1px, transparent 1px),
radial-gradient(white 1px, transparent 1px);
background-size:60px 60px;
opacity:0.12;
animation:starsMove 90s linear infinite;
z-index:-3;
}

@keyframes starsMove{
from{
transform:translateY(0);
}
to{
transform:translateY(-500px);
}
}

/* ===== LOGIN ===== */

#login{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.92);
backdrop-filter:blur(12px);
z-index:9999;
transition:0.6s;
}

.login-box{
width:90%;
max-width:380px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 0 50px rgba(255,77,109,0.3);
text-align:center;
animation:fade 1s ease;
}

.login-box input{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:14px;
text-align:center;
outline:none;
background:rgba(255,255,255,0.92);
}

.login-box button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.login-box button:hover{
transform:scale(1.03);
}

/* ===== CARD ===== */

.card{
width:92%;
max-width:950px;
margin:70px auto 25px auto;
padding:55px;
border-radius:35px;
background:rgba(255,255,255,0.07);
backdrop-filter:blur(18px);
box-shadow:0 0 60px rgba(255,77,109,0.25);
text-align:center;
animation:fade 1.5s ease;
transition:0.3s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
font-size:clamp(34px,6vw,62px);
color:#ffe5ec;
margin-bottom:10px;
}

.sub{
font-size:clamp(16px,3vw,22px);
opacity:0.8;
margin-bottom:25px;
}

.cinematic{
font-size:22px;
opacity:0;
margin-bottom:35px;
animation:fadeCinema 3s forwards;
}

@keyframes fadeCinema{
0%{
opacity:0;
transform:translateY(20px);
}
100%{
opacity:0.85;
transform:translateY(0);
}
}

.text{
font-size:clamp(18px,4vw,27px);
line-height:2.4;
white-space:pre-line;
min-height:200px;
}

button{
margin-top:25px;
padding:16px 38px;
border:none;
border-radius:50px;
font-size:clamp(18px,4vw,24px);
cursor:pointer;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
color:white;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

/* ===== FINAL ===== */

.hidden{
display:none;
margin-top:25px;
font-size:30px;
line-height:2;
color:#fff0f3;
animation:fade 1s ease;
}

/* ===== HEART ===== */

.heart{
position:fixed;
bottom:20px;
right:20px;
font-size:30px;
animation:pulse 1.5s infinite;
opacity:0.7;
z-index:50;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.3);}
100%{transform:scale(1);}
}

/* ===== FLOAT ===== */

@keyframes float{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(-200px);
opacity:0;
}
}

/* ===== GALLERY ===== */

.photo-gallery{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:45px;
}

.photo{
width:220px;
padding:12px;
background:white;
border-radius:18px;
transform:rotate(-2deg);
box-shadow:0 0 30px rgba(0,0,0,0.35);
transition:0.4s;
opacity:0;
transform:translateY(40px);
}

.photo.active{
opacity:1;
transform:translateY(0);
}

.photo:nth-child(2){
transform:rotate(2deg);
}

.photo:nth-child(3){
transform:rotate(-1deg);
}

.photo:hover{
transform:scale(1.05);
}

.photo img{
width:100%;
display:block;
border-radius:12px;
}

/* ===== SECRET ===== */

.secret-box{
margin-top:50px;
opacity:0;
transform:translateY(40px);
transition:1s;
}

.secret-box.active{
opacity:1;
transform:translateY(0);
}

.secret-message{
display:none;
margin-top:22px;
font-size:25px;
line-height:2;
color:#ffe5ec;
animation:fade 1s ease;
}

/* ===== DAYS ===== */

.days-box{
margin-top:45px;
font-size:24px;
opacity:0;
transform:translateY(40px);
transition:1s;
}

.days-box.active{
opacity:0.9;
transform:translateY(0);
}

/* ===== MUSIC PLAYER ===== */

.music-player{
width:92%;
max-width:950px;
margin:0 auto 60px auto;
padding:20px;
border-radius:28px;
background:rgba(255,255,255,0.07);
backdrop-filter:blur(18px);
box-shadow:0 0 40px rgba(255,77,109,0.18);
display:flex;
align-items:center;
gap:18px;
flex-wrap:wrap;
}

.music-info{
flex:1;
min-width:180px;
}

.song-name{
font-size:20px;
color:#ffe5ec;
margin-bottom:8px;
}

.time{
font-size:15px;
opacity:0.75;
}

.progress-container{
flex:2;
height:10px;
background:rgba(255,255,255,0.15);
border-radius:20px;
overflow:hidden;
cursor:pointer;
min-width:180px;
}

.progress{
width:0%;
height:100%;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
border-radius:20px;
transition:0.1s;
}

.player-btn{
width:58px;
height:58px;
border:none;
border-radius:50%;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
color:white;
font-size:22px;
cursor:pointer;
transition:0.3s;
margin-top:0;
}

.player-btn:hover{
transform:scale(1.08);
}

/* ===== ENDING ===== */

.ending{
opacity:0;
pointer-events:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
background:rgba(0,0,0,0.8);
backdrop-filter:blur(10px);
transition:1.5s;
z-index:99999;
text-align:center;
padding:20px;
}

.show-ending{
opacity:1;
}

/* ===== MOBILE ===== */

@media(max-width:700px){

.card{
padding:35px 25px;
}

.photo{
width:85%;
}

.music-player{
padding:18px;
gap:15px;
}

.song-name{
font-size:18px;
}

.player-btn{
width:52px;
height:52px;
font-size:20px;
}

.secret-message{
font-size:21px;
}

.days-box{
font-size:20px;
}

.ending{
font-size:28px;
}

}

</style>
</head>

<body class="lock">

<div class="overlay"></div>

<div class="stars"></div>

<!-- LOGIN -->

<div id="login">

<div class="login-box">

<input type="password" id="pass" placeholder="">

<button onclick="check()">
دخول
</button>

</div>

</div>

<!-- MAIN -->

<div class="card" id="page">

<div class="title">
لأجلكِ فقط
</div>

<div class="sub">
هاي الرسالة مو مجرد كلام… هاي شعور
</div>

<div class="cinematic">
هناك شخص… غير كل شيء ✨
</div>

<div class="text" id="typing"></div>

<!-- PHOTOS -->

<div class="photo-gallery">

<div class="photo reveal">
<img src="photo1.jpeg">
</div>

<div class="photo reveal">
<img src="photo2.jpeg">
</div>

<div class="photo reveal">
<img src="photo3.jpeg">
</div>

</div>

<!-- SECRET -->

<div class="secret-box reveal">

<button onclick="openSecret()">
💌 رسالة سرية
</button>

<div id="secretMessage" class="secret-message">
  اهتمي بدراستج وصحتج ونفسج بنيتي
  والج هدية بعد الامتحانات مباشر ترضيج
  ومهما صار… تبقين أجمل صدفة بحياتي 🌸
</div>

</div>

<!-- DAYS -->

<div class="days-box reveal">
❤️ صارلنا <span id="days"></span> يوم
</div>

<button onclick="love()">
احبك 💗
</button>

<div id="final" class="hidden">
يمكن الدنيا كلها تتغير…  
بس حبي إلج يظل ثابت 🫀
</div>

</div>

<!-- MUSIC PLAYER -->

<div class="music-player">

<div class="music-info">

<div class="song-name">
🎵 حبي الابدي
</div>

<div class="time">
<span id="current">0:00</span>
/
<span id="duration">0:00</span>
</div>

</div>

<div class="progress-container" onclick="seek(event)">
<div class="progress" id="progress"></div>
</div>

<button class="player-btn" onclick="toggleMusic()" id="playBtn">
⏸
</button>

</div>

<div class="heart">
🫀
</div>

<!-- AUDIO -->

<audio id="audio">
<source src="Myflower.webm" type="audio/webm">
</audio>

<!-- ENDING -->

<div class="ending" id="ending">
شكراً لأنج موجودة بحياتي ✨
</div>

<script>

/* ===== PASSWORD ===== */

function check(){

let p = document.getElementById("pass").value;

if(p === "👈🏻🪐👉🏻"){

document.getElementById("login").style.opacity="0";

setTimeout(()=>{
document.getElementById("login").style.display="none";
},600);

document.body.classList.remove("lock");
document.body.classList.add("scroll");

audio.volume = 1;

audio.play().catch(()=>{});

startTyping();

}

}

/* ===== TEXT ===== */

const text = `
يمكن مو كل مرة عرفت أتصرف صح…  
ويمكن مرات جرحت قلبچ بدون ما أقصد.

بس أكو شيء واحد مستحيل يتغير:

إنتِ مو مجرد شخص…
إنتِ شعور ما ينمحى.

مو جاي أطلب تنسين…
بس أريدچ تفهمين إحساسي الحقيقي.

لأن آخر شيء أريده بالدنيا  
هو أخسر إنسانة مثلچ.

انتي حبي الابدي وتاج راسي ونظر عيني
اللله يديمج اليه ، ياقمر شمسج باقية تضوي وتحبج🌓
`;

let i = 0;

function startTyping(){

let typingSound = new Audio("https://www.soundjay.com/button/sounds/button-16.mp3");

function type(){

if(i < text.length){

document.getElementById("typing").innerHTML += text[i];

typingSound.currentTime = 0;

typingSound.play().catch(()=>{});

i++;

setTimeout(type,60);

}

}

type();

}

/* ===== LOVE EFFECT ===== */

function love(){

document.getElementById("final").style.display="block";

document.getElementById("page").style.transform="scale(1.02)";

setTimeout(()=>{
document.getElementById("page").style.transform="scale(1)";
},200);

for(let i=0;i<15;i++){

let h = document.createElement("div");

h.innerHTML = "💗";

h.style.position = "fixed";

h.style.left = Math.random()*100 + "vw";

h.style.top = "80vh";

h.style.fontSize = "22px";

h.style.animation = "float 2s linear forwards";

h.style.pointerEvents = "none";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},2000);

}

}

/* ===== SECRET ===== */

function openSecret(){

document.getElementById("secretMessage").style.display="block";

}

/* ===== DAYS ===== */

const startDate = new Date("2025-01-01");

const today = new Date();

const diff = today - startDate;

const days = Math.floor(diff / (1000 * 60 * 60 * 24));

document.getElementById("days").innerHTML = days;

/* ===== TOUCH HEARTS ===== */

document.addEventListener("click",(e)=>{

let heart = document.createElement("div");

heart.innerHTML = "💗";

heart.style.position = "fixed";

heart.style.left = e.clientX + "px";

heart.style.top = e.clientY + "px";

heart.style.fontSize = "20px";

heart.style.pointerEvents = "none";

heart.style.animation = "float 2s linear forwards";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},2000);

});

/* ===== SCROLL REVEAL ===== */

const reveals = document.querySelectorAll(".reveal");

window.addEventListener("scroll",()=>{

reveals.forEach((el)=>{

const top = el.getBoundingClientRect().top;

if(top < window.innerHeight - 80){

el.classList.add("active");

}

});

});

/* ===== MUSIC ===== */

const audio = document.getElementById("audio");

const progress = document.getElementById("progress");

const current = document.getElementById("current");

const duration = document.getElementById("duration");

const playBtn = document.getElementById("playBtn");

/* format */

function formatTime(sec){

let minutes = Math.floor(sec / 60);

let seconds = Math.floor(sec % 60);

if(seconds < 10){
seconds = "0" + seconds;
}

return minutes + ":" + seconds;

}

/* update */

audio.addEventListener("timeupdate",()=>{

let percent = (audio.currentTime / audio.duration) * 100;

progress.style.width = percent + "%";

current.innerHTML = formatTime(audio.currentTime);

});

/* duration */

audio.addEventListener("loadedmetadata",()=>{

duration.innerHTML = formatTime(audio.duration);

});

/* play pause */

function toggleMusic(){

if(audio.paused){

audio.play();

playBtn.innerHTML = "⏸";

}else{

audio.pause();

playBtn.innerHTML = "▶";

}

}

/* seek */

function seek(e){

const width = e.currentTarget.clientWidth;

const clickX = e.offsetX;

const durationValue = audio.duration;

audio.currentTime = (clickX / width) * durationValue;

}

/* ending */

audio.addEventListener("ended",()=>{

playBtn.innerHTML = "▶";

document.getElementById("ending").classList.add("show-ending");

});

</script>

</body>
</html>
